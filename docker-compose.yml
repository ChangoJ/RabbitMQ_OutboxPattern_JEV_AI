services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: messageguard
      POSTGRES_PASSWORD: messageguard
      POSTGRES_DB: messageguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
